name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: affordance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d affordance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    # Tests create and use their own affordance_test database on the
    # service; the default TEST_DATABASE_URL already points there.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
