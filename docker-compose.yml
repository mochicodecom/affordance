services:
  postgres:
    image: postgres:17-alpine
    container_name: affordance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: affordance
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d affordance"]
      interval: 2s
      timeout: 3s
      retries: 15
